name: "Pullfrog Action"
description: "Execute coding agents with a prompt"
author: "Pullfrog"

inputs:
  prompt:
    description: "Prompt to send to the agent (string or JSON payload)"
    required: false
  prompt_file:
    description: "Path to a file (relative to GITHUB_WORKSPACE) whose contents are used as the prompt. Set exactly one of prompt or prompt_file."
    required: false
  timeout:
    description: "Maximum run duration (e.g., 10m, 1h30m). Default: 1h"
    required: false
  model:
    description: "Model to use — a curated slug (e.g. anthropic/claude-opus) or a raw models.dev specifier (e.g. google/gemini-3.1-flash-lite). Overrides repo settings."
    required: false
  effort:
    description: "Reasoning effort: low, medium, high, xhigh, max, or a position on [0,1]. Lands on the running model's own range, rounding down. Overrides repo settings."
    required: false
  debug:
    description: "Set to `enabled` to raise this run's logging — makes `log.debug` output visible and puts the opencode server at INFO, which is the only way to see a run that fails with an empty log. Equivalent to the `--debug` run flag."
    required: false
  cwd:
    description: "Working directory for the agent (defaults to GITHUB_WORKSPACE)"
    required: false
  push:
    description: "Git push permission: disabled (read-only), restricted (push feature branches only — blocks pushes to the default branch, branch deletion, and tag pushes), or enabled (full push access). Default: enabled"
    required: false
  shell:
    description: "Shell permission: disabled, restricted (filters secrets from env vars), or enabled. Can only make the repository's console setting (restricted by default) stricter."
    required: false
  status_checks:
    description: "DEPRECATED — both checks are now repository settings, editable in the Pullfrog console (Automations → Review PRs). Set them there and drop this input. It keeps working on v0 either way: it can only turn a check on, and silently ignoring it would strip a required check from anyone still relying on it."
    required: false
  progress_comments:
    description: "Suppress the progress comment's live task-list updates: enabled (default) or disabled. It does NOT stop the initial `Leaping into action...` comment — the server posts that before the run starts and never reads workflow YAML, so only the repository setting suppresses it (Pullfrog console → Comments → Progress comments), which is what to use if you want no progress comment at all. Final reviews, result comments, and failure reports are unaffected."
    required: false
  output_schema:
    description: "JSON Schema (draft-07) for structured output validation. When provided, the action output becomes required and must conform to this schema."
    required: false
  token:
    description: "GitHub-provided token with job-scoped permissions. Do not set this unless you know what you are doing."
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: "It's set when the prompt explicitly requests it and is required when output_schema is provided; use it to capture actionable output for the next workflow step."

runs:
  using: "node24"
  main: "entry.ts"
  # Always-run post step persists best-effort state that must survive
  # cancellation, timeouts, and unhandled errors in the main step. Today's
  # only consumer: Codex auth.json refresh write-back. See wiki/codex-auth.md.
  post: "entryPost.ts"
  post-if: "always()"

branding:
  icon: "code"
  color: "green"
