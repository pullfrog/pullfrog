name: Build and Push Agent Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - ".github/workflows/publish-agent-image.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: latest)"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || 'latest' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_SHA::12}"
          fi
          # GHCR requires lowercase image names
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          GHCR_IMAGE="ghcr.io/${OWNER_LC}/pullfrog-agent"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=${GHCR_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image=${GHCR_IMAGE}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.ghcr_image }}:latest

      - name: Output image URI
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }}"
          echo "Also tagged :latest"
